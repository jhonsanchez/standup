version: 2

project_name: standup

builds:
  - main: .
    binary: standup
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

brews:
  - name: standup
    repository:
      owner: jhonsanchez
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/jhonsanchez/standup
    description: Terminal dashboard for Jira sprint issues and GitHub PRs across clients
    license: MIT
    install: bin.install "standup"
    test: system "#{bin}/standup --version"
    caveats: |
      Config lives at ~/.config/standup/config.yaml — a commented starter
      file is created the first time you run standup.

      Icons need a Nerd Font (e.g. JetBrainsMono Nerd Font):
        brew install --cask font-jetbrains-mono-nerd-font
      …or set `icons: ascii` in the config.

      Verify your setup any time with:  standup doctor

release:
  footer: |
    ---
    ## Install

    **macOS / Linux — Homebrew**
    ```sh
    brew install jhonsanchez/tap/standup
    ```

    **Linux — direct binary** (use `arm64` on ARM machines)
    ```sh
    curl -sL https://github.com/jhonsanchez/standup/releases/download/{{ .Tag }}/standup_{{ .Version }}_linux_amd64.tar.gz | tar xz standup
    sudo install standup /usr/local/bin/
    ```

    **macOS — direct binary** (Apple Silicon: `arm64`, Intel: `amd64`)
    ```sh
    curl -sL https://github.com/jhonsanchez/standup/releases/download/{{ .Tag }}/standup_{{ .Version }}_darwin_arm64.tar.gz | tar xz standup
    sudo install standup /usr/local/bin/
    ```

    **Windows** — download `standup_{{ .Version }}_windows_amd64.zip` (or `arm64`) from the assets below, unzip, and put `standup.exe` on your `PATH`.

    **Go**
    ```sh
    go install github.com/jhonsanchez/standup@{{ .Tag }}
    ```

    **Already installed?** `standup upgrade` (or `brew upgrade standup`).

    Optional dependencies (Nerd Font, `gh`, `lazygit`, `xclip`) light up extra features — see the [README](https://github.com/jhonsanchez/standup#dependencies), and run `standup doctor` to check your setup.
