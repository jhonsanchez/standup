version: 2

project_name: standup

builds:
  - main: .
    binary: standup
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

brews:
  - name: standup
    repository:
      owner: jhonsanchez
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/jhonsanchez/standup
    description: Terminal dashboard for Jira sprint issues and GitHub PRs across clients
    license: MIT
    install: bin.install "standup"
    test: system "#{bin}/standup --version"

release:
  footer: |
    ---
    Install: `brew install jhonsanchez/tap/standup` · `go install github.com/jhonsanchez/standup@{{.Tag}}`
